name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Build app folder
        run: pyinstaller --noconfirm fetchly.spec
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\fetchly.iss'
      - name: Build portable single-file exe
        run: |
          $env:FETCHLY_ONEFILE = "1"
          pyinstaller --noconfirm fetchly.spec
          Move-Item dist\Fetchly.exe dist\Fetchly-Portable.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Fetchly-windows
          path: |
            dist/Fetchly-Setup-*.exe
            dist/Fetchly-Portable.exe
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Fetchly-Setup-*.exe
            dist/Fetchly-Portable.exe
